<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Words of Wisdom</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Wisdom">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f7f3ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1a18" media="(prefers-color-scheme: dark)">
  <style>
    :root {
      --bg: #f7f3ec;
      --text: #2b2622;
      --muted: #7a6f64;
      --accent: #b5651d;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1a18;
        --text: #eee6dc;
        --muted: #a39788;
        --accent: #e09a5a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }
    main { max-width: 40rem; text-align: center; }
    .label {
      margin: 0 0 0.25rem;
      color: var(--accent);
      font: 600 0.8rem/1.4 system-ui, sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    #date { margin: 0 0 2rem; color: var(--muted); font: 0.9rem/1.4 system-ui, sans-serif; }
    blockquote { margin: 0; }
    #phrase { margin: 0; font-size: clamp(1.5rem, 4vw, 2.25rem); line-height: 1.35; }
    #author { margin: 1.25rem 0 0; color: var(--muted); font-style: italic; font-size: 1.1rem; }
    #install {
      margin: 3rem auto 0;
      max-width: 22rem;
      font: 1rem/1.5 system-ui, sans-serif;
    }
    #install-button {
      display: block;
      width: 100%;
      padding: 0.9rem 1rem;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font: 600 1.05rem/1.2 system-ui, sans-serif;
      cursor: pointer;
    }
    #install-help {
      margin-top: 1rem;
      padding: 1rem 1.25rem;
      border-radius: 12px;
      background: color-mix(in srgb, var(--accent) 10%, transparent);
      text-align: left;
    }
    #install-steps { margin: 0; padding-left: 1.25rem; }
    #install-steps li + li { margin-top: 0.5rem; }
    .share-icon { width: 1.2em; height: 1.2em; vertical-align: -0.2em; color: #007aff; }
    #install-dismiss {
      margin-top: 0.75rem;
      border: 0;
      background: none;
      color: var(--muted);
      font: 0.9rem system-ui, sans-serif;
      text-decoration: underline;
      cursor: pointer;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <p class="label">Wisdom of the day</p>
    <p id="date"></p>
    <blockquote>
      <p id="phrase">Loading…</p>
      <footer id="author"></footer>
    </blockquote>
    <section id="install" hidden>
      <button id="install-button" type="button">Add to my Home Screen</button>
      <div id="install-help" hidden>
        <ol id="install-steps"></ol>
      </div>
      <button id="install-dismiss" type="button">Not now</button>
    </section>
  </main>
  <script src="app.js"></script>
  <script src="install.js"></script>
</body>
</html>
